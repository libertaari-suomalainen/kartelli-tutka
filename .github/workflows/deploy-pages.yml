name: Build & Deploy Static Web App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Zero External Dependencies)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit & SSOT Verification Tests
        run: PYTHONPATH=src python3 -B -m unittest discover -v -s tests

      - name: Compile SSOT Snapshot, Excel Workbook & Static Web App
        run: PYTHONPATH=src python3 -B -m kartelli_tutka.build_all

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
